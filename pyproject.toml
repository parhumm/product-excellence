[project]
name = "product-excellence"
version = "1.2.0"
description = "Local autonomous web product evaluation console"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "playwright>=1.51,<2", "httpx>=0.27,<1", "pyyaml>=6,<7", "pillow>=10", "python-multipart>=0.0.18", "jsonschema>=4,<5"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
